
services:
  postgres:
    image: postgres:17
    container_name: olist-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: olist_warehouse

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U olist -d olist_warehouse
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
