name: olist-airflow

services:
  airflow:
    image: apache/airflow:3.3.2
    container_name: olist-airflow
    command: standalone
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      # 数据库连接参数：必须在environment下面
      PGHOST: "olist-postgres"
      PGPORT: "5432"
      PGDATABASE: "olist_warehouse"
      PGUSER: "olist"
      OLIST_PG_PASSWORD_FILE: "/run/secrets/olist/pg_password.txt"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./state:/opt/airflow
      - ../src:/workspace/src:ro
      - ../data/batches:/workspace/data/batches:rw
      - ../src/serving:/workspace/src/serving:ro
      - ./secrets/pg_password.txt:/run/secrets/olist/pg_password.txt:ro
    restart: unless-stopped
  spark-runner:
    image: spark:4.2.0-python3
    container_name: olist-spark-runner
    group_add:
      - "0"
    command:
      - python3
      - -u
      - /workspace/jobs/spark_job_runner.py
    mem_limit: 2g
    cpus: 2
    volumes:
      # Runner程序
      - ../jobs:/workspace/jobs:ro
      # 原有M1-M8转换程序
      - ../src/transformations:/workspace/src/transformations:ro
      # 新增M10程序
      - ../src/m10:/workspace/src/m10:ro
      # 原有DWD、DWS数据
      - ../data/dws:/workspace/data/dws:ro
      - ../data/dwd:/workspace/data/dwd:ro
      # 新增M9订单财务汇总
      - ../data/m9/dws:/workspace/data/m9/dws:ro
      # 旧ADS，用于回归验证
      - ../data/ads:/workspace/data/ads:ro
      # 批次隔离输出，允许写入
      - ../data/batches:/workspace/data/batches:rw
    restart: unless-stopped