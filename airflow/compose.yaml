name: olist-airflow

services:
  airflow:
    image: apache/airflow:3.3.2
    container_name: olist-airflow
    command: standalone
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./state:/opt/airflow
      - ../src:/workspace/src:ro
      - ../data/batches:/workspace/data/batches:rw
    restart: "no"
